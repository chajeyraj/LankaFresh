<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon updated to project logo -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanka Drop | Authentic Sri Lankan Goods</title>
    <meta name="description" content="Shop authentic Sri Lankan groceries, spices, tea, and snacks delivered worldwide. Freshly sourced from Sri Lanka with transparent supply chain and secure checkout." />
    <meta name="keywords" content="Sri Lankan groceries, Lanka Drop, Ceylon tea, Sri Lanka spices, Sri Lankan snacks, overseas delivery, authentic Sri Lankan food" />
    <meta name="author" content="Lanka Drop" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="http://lankadrop.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lanka Drop | Authentic Sri Lankan Goods" />
    <meta property="og:description" content="Discover premium Sri Lankan groceries, spices, tea, and snacks shipped globally. Experience Sri Lankan flavors with trusted sourcing and fast delivery." />
    <meta property="og:url" content="http://lankadrop.com/" />
    <meta property="og:image" content="http://lankadrop.com/logo.png" />
    <meta property="og:site_name" content="Lanka Drop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lanka Drop | Authentic Sri Lankan Goods" />
    <meta name="twitter:description" content="Order authentic Sri Lankan groceries, spices, tea, and snacks from anywhere in the world." />
    <meta name="twitter:image" content="http://lankadrop.com/logo.png" />
    <meta name="theme-color" content="#f97316" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#f97316', // Orange 500
                '600': '#ea580c',   // Orange 600
                '700': '#c2410c',   // Orange 700
              },
            },
            keyframes: {
              'fade-in-up': {
                '0%': {
                  opacity: '0',
                  transform: 'translateY(20px)'
                },
                '100%': {
                  opacity: '1',
                  transform: 'translateY(0)'
                },
              },
              'slide-up': {
                '0%': {
                  transform: 'translateY(100%)'
                },
                '100%': {
                  transform: 'translateY(0)'
                },
              },
              'cart-bounce': {
                '0%, 100%': {
                  transform: 'scale(1)'
                },
                '25%': {
                  transform: 'scale(1.3)'
                },
                '50%': {
                  transform: 'scale(0.9)'
                },
                '75%': {
                  transform: 'scale(1.15)'
                },
              }
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.6s ease-out forwards',
              'slide-up': 'slide-up 0.3s ease-out forwards',
              'cart-bounce': 'cart-bounce 0.5s ease-in-out'
            }
          }
        }
      }
    </script>
    <style>
      .cultural-divider .line {
        transform: scaleX(0);
        transition: transform 0.6s ease-out;
      }
      .cultural-divider .line-left { transform-origin: left; }
      .cultural-divider .line-right { transform-origin: right; }

      .cultural-divider.animate .line-left { transform: scaleX(1); transition-delay: 0s; }
      .cultural-divider.animate .line-right { transform: scaleX(1); transition-delay: 0s; }

      .cultural-divider .center-motif {
          transform: scale(0.5);
          opacity: 0;
          transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out;
          transition-delay: 0.3s;
      }
      .cultural-divider.animate .center-motif {
          transform: scale(1);
          opacity: 1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.76.1"
  }
}
</script>
</head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Lanka Drop",
  "url": "http://lankadrop.com/",
  "logo": "http://lankadrop.com/logo.png",
  "sameAs": [
    "https://www.facebook.com/lankadrop",
    "https://www.instagram.com/lankadrop"
  ],
  "description": "Shop authentic Sri Lankan groceries, spices, tea, and snacks delivered worldwide.",
  "brand": "Lanka Drop",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer support",
    "areaServed": "Worldwide",
    "availableLanguage": ["en"]
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://lankadrop.com/shop?search={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
    </script>
  </body>
</html>
